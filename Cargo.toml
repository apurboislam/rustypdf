[package]
name = "rustypdf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
axum = "0.8"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tiny-skia = "0.12"
tower = { version = "0.5.3", features = ["util"] }
